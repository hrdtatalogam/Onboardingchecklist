<style>
  :root{
    --navy:#071C36; --blue:#0054A7; --blue2:#1B74CF; --green:#9DC816; --green-deep:#5E8A0A;
    --ink:#14202E; --steel:#5A6878; --steel-light:#9AA7B6; --paper:#EEF3F8; --card:#FFFFFF;
    --line:#D9E1EA; --ok:#4C8A12; --danger:#C24B3F; --ease:cubic-bezier(.2,.7,.2,1);
  }
  *{box-sizing:border-box;}
  :root{ color-scheme:light; }
  body{ color:var(--ink); }
  input,textarea,select{ color:var(--ink);font-family:inherit; }
  input,textarea,select{ background:#fff; }
  input::placeholder,textarea::placeholder{ color:var(--steel-light);opacity:1; }
  body{ margin:0;padding:24px;min-height:100vh;font-family:'Inter',sans-serif;background:#E4EBF3; }
  .ock-signoff-field input,.ock-admin-row input[type=text]{ background:transparent; }
  @keyframes rise{ from{opacity:0;transform:translateY(10px);} to{opacity:1;transform:none;} }
  @keyframes drift{ 0%{background-position:0% 50%;} 100%{background-position:100% 50%;} }
  @keyframes shimmer{ from{transform:translateX(-100%);} to{transform:translateX(100%);} }
  @keyframes pop{ 0%{transform:scale(.4) rotate(-20deg);} 60%{transform:scale(1.25) rotate(-6deg);} 100%{transform:scale(1) rotate(-6deg);} }
  @keyframes load{ 0%{left:-40%;} 100%{left:100%;} }
  .ock-root{
    color:var(--ink); background-color:var(--paper);
    background-image:linear-gradient(rgba(0,84,167,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(0,84,167,.07) 1px,transparent 1px);
    background-size:28px 28px; border-radius:16px; min-height:600px; overflow:hidden;
    border:1px solid var(--line); box-shadow:0 18px 50px -24px rgba(7,28,54,.45);
  }
  .ock-boot{ text-align:center;padding:110px 20px;color:var(--steel);animation:rise .4s var(--ease); }
  .ock-boot img{ width:64px;height:auto;margin-bottom:18px; }
  .ock-boot .big{ font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:17px;color:var(--ink);margin-bottom:6px; }
  .ock-boot .sub{ font-size:12.5px;margin-bottom:16px; }
  .ock-boot-bar{ position:relative;width:180px;height:3px;border-radius:3px;background:var(--line);margin:0 auto 12px;overflow:hidden; }
  .ock-boot-bar i{ position:absolute;top:0;width:40%;height:100%;background:linear-gradient(90deg,var(--blue),var(--green));animation:load 1.1s ease-in-out infinite; }

  .ock-header{ position:relative;color:#fff;padding:20px 28px 0;background:linear-gradient(115deg,#071C36 0%,#0A2D56 45%,#073A73 70%,#0A2D56 100%);background-size:200% 200%;animation:drift 14s ease-in-out infinite alternate;overflow:hidden; }
  .ock-header::before{ content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.045) 1px,transparent 1px);background-size:28px 28px;pointer-events:none; }
  .ock-header::after{ content:"";position:absolute;left:0;top:0;height:3px;width:100%;background:linear-gradient(90deg,var(--green),var(--blue2) 60%,transparent); }
  .ock-header > *{ position:relative;z-index:1; }
  .ock-title{ font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:20px;display:flex;align-items:center;gap:12px; }
  .ock-title .mark{ width:36px;height:36px;border-radius:9px;background:#fff;display:flex;align-items:center;justify-content:center;overflow:hidden;padding:3px;box-shadow:0 0 0 2px rgba(157,200,22,.55); }
  .ock-title .mark img{ width:100%;height:100%;object-fit:contain; }
  .ock-sub{ font-size:11px;color:#9FB6D1;font-family:'IBM Plex Mono',monospace;margin:4px 0 16px 48px;letter-spacing:.05em; }
  .ock-type-switch{ display:flex;gap:6px; }
  .ock-type-btn{ flex:1;text-align:left;padding:11px 15px;border-radius:10px 10px 0 0;border:1px solid transparent;border-bottom:none;background:rgba(255,255,255,.07);color:#C3D2E4;cursor:pointer;font-family:'Space Grotesk',sans-serif;transition:background .25s,color .25s,transform .25s var(--ease); }
  .ock-type-btn:hover{ background:rgba(255,255,255,.14);transform:translateY(-2px); }

  .ock-tabs{ display:flex;gap:4px;padding:0 28px;border-bottom:1px solid var(--line);background:var(--card);flex-wrap:wrap; }

  .ock-grid{ display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px; }
  .ock-card{ position:relative;border:1px solid var(--line);border-radius:12px;padding:16px;cursor:pointer;background:#fff;overflow:hidden;opacity:0;animation:rise .5s var(--ease) forwards;animation-delay:calc(var(--i,0)*55ms);transition:box-shadow .25s,transform .25s var(--ease),border-color .25s; }
  .ock-card::before{ content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:linear-gradient(var(--blue),var(--green));transform:scaleY(0);transform-origin:top;transition:transform .35s var(--ease); }
  .ock-card:hover{ box-shadow:0 12px 26px -14px rgba(0,84,167,.45);transform:translateY(-3px);border-color:#B9CDE3; }
  .ock-card:hover::before{ transform:scaleY(1); }
  .ock-card-name{ font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:15px; }
  .ock-card-pos{ font-size:12px;color:var(--steel);margin-top:2px; }

  .ock-progress-wrap{ position:relative;margin-top:12px;height:7px;border-radius:5px;background:var(--paper);overflow:hidden;border:1px solid var(--line); }

  .ock-status-pill.progress{ background:#E3EEF9;color:var(--blue); }

  .ock-status-pill.done{ background:#EAF4D2;color:var(--green-deep); }

  .ock-detail-header{ display:flex;justify-content:space-between;align-items:flex-start;border-bottom:1px dashed var(--line);padding-bottom:16px;margin-bottom:14px;flex-wrap:wrap;gap:14px; }

  .ock-chips{ display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px; }
  .ock-chip{ font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:600;padding:6px 12px;border-radius:20px;border:1px solid var(--line);background:#fff;color:var(--steel);cursor:pointer;transition:all .2s; }
  .ock-chip:hover{ border-color:var(--blue);color:var(--blue); }
  .ock-chip.active{ background:var(--blue);border-color:var(--blue);color:#fff; }
  .ock-banner{ display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:11px 14px;border-radius:10px;font-size:12.5px;margin-bottom:16px;background:#EEF5FC;border:1px solid #C9DDF2;color:#0B3A6B;animation:rise .35s var(--ease); }

  .ock-cat-block{ margin-bottom:22px; }
  .ock-cat-title{ font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--blue);margin-bottom:8px;padding-bottom:6px;border-bottom:1px solid var(--line); }

  .ock-item-title.done{ color:var(--steel); }
  .ock-item-note{ width:100%;margin-top:6px;font-size:12.5px;font-family:'Inter',sans-serif;border:1px solid var(--line);border-radius:7px;padding:7px 10px;background:#fff;transition:border-color .2s,box-shadow .2s; }
  .ock-item-note:focus{ outline:none;border-color:var(--blue);box-shadow:0 0 0 3px rgba(0,84,167,.12); }
  .ock-ro-note{ margin-top:4px;font-size:12px;color:var(--steel);font-style:italic; }

  .ock-admin-cat{ margin-bottom:18px; }
  .ock-cat-mgmt{ border:1px solid #BFD6EE;border-radius:12px;padding:15px 17px;background:#F4F9FE; }
  .ock-admin-list{ display:flex;flex-direction:column;gap:8px; }
  .ock-admin-row{ display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:9px;padding:9px 12px;background:#fff; }
  .ock-admin-row input[type=text]{ flex:1;border:none;font-size:13px;font-family:'Inter',sans-serif;background:transparent; }
  .ock-admin-row input[type=text]:focus{ outline:none; }
  .ock-order-btns{ display:flex;flex-direction:column;gap:1px; }
  .ock-order-btns button{ border:none;background:transparent;cursor:pointer;color:var(--steel-light);font-size:10px;line-height:1;padding:2px; }
  .ock-order-btns button:hover{ color:var(--blue); }

  .ock-modal-bg{ position:fixed;inset:0;background:rgba(7,28,54,.55);backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;z-index:50;padding:20px;animation:rise .2s ease; }
  .ock-modal{ background:#fff;border-radius:14px;padding:24px;width:100%;max-width:450px;max-height:85vh;overflow-y:auto;border-top:4px solid var(--green);animation:rise .3s var(--ease);box-shadow:0 30px 70px -20px rgba(7,28,54,.6); }
  .ock-modal h3{ font-family:'Space Grotesk',sans-serif;margin:0 0 4px;font-size:17px; }
  .ock-modal .modal-sub{ font-size:12px;color:var(--steel);margin-bottom:16px;font-family:'IBM Plex Mono',monospace; }
  .ock-field{ margin-bottom:12px; }
  .ock-field label{ font-size:12px;font-weight:600;color:var(--steel);display:block;margin-bottom:4px; }
  .ock-field input,.ock-field select,.ock-field textarea{ width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:8px;font-size:13.5px;font-family:'Inter',sans-serif; }
  .ock-field input:focus,.ock-field select:focus,.ock-field textarea:focus{ outline:none;border-color:var(--blue);box-shadow:0 0 0 3px rgba(0,84,167,.12); }
  .ock-modal-actions{ display:flex;justify-content:flex-end;gap:8px;margin-top:16px; }

  table.ock-table{ width:100%;border-collapse:collapse;font-size:12.5px; }
  table.ock-table th{ text-align:left;font-family:'IBM Plex Mono',monospace;font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--blue);border-bottom:2px solid var(--line);padding:9px 10px; }
  table.ock-table td{ padding:10px;border-bottom:1px solid var(--line); }
  table.ock-table tbody tr{ transition:background .2s; }
  table.ock-table tbody tr:hover td{ background:#F1F7FD; }
  .ock-link-btn{ background:none;border:none;color:var(--blue);font-weight:600;cursor:pointer;font-size:12px;padding:0; }
  .ock-link-btn:hover{ text-decoration:underline; }
  .ock-toast{ position:fixed;bottom:22px;right:22px;background:var(--navy);color:#fff;padding:11px 18px;border-radius:10px;font-size:13px;z-index:60;border-left:4px solid var(--green);opacity:0;transform:translateY(14px);pointer-events:none;transition:opacity .3s,transform .3s var(--ease);max-width:340px; }
  .ock-toast.show{ opacity:1;transform:none; }
  .ock-toast.err{ border-left-color:var(--danger); }

  .ock-signoff{ margin-top:8px;border:1px dashed var(--steel-light);border-radius:12px;padding:16px 18px;background:var(--paper); }
  .ock-signoff-title{ font-family:'IBM Plex Mono',monospace;font-size:10.5px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--blue);margin-bottom:12px; }
  .ock-signoff-grid{ display:grid;grid-template-columns:1fr 1fr;gap:16px; }
  .ock-sigpad-wrap{ margin-top:14px; }
  .ock-sigpad-wrap label{ font-size:11.5px;color:var(--steel);font-weight:600;display:block;margin-bottom:5px; }
  .ock-sigpad-box{ position:relative;border:1.5px dashed var(--steel-light);border-radius:9px;background:#fff;overflow:hidden;touch-action:none; }
  .ock-sigpad-box canvas{ display:block;width:100%;height:130px;cursor:crosshair; }
  .ock-sigpad-box img{ display:block;height:110px;margin:6px auto; }
  .ock-sigpad-placeholder{ position:absolute;inset:0;display:flex;align-items:flex-end;justify-content:center;padding-bottom:10px;font-size:11px;color:var(--steel-light);font-family:'IBM Plex Mono',monospace;pointer-events:none; }
  .ock-sigpad-actions{ display:flex;justify-content:flex-end;margin-top:6px; }
  .ock-signoff-field label{ font-size:11.5px;color:var(--steel);font-weight:600;display:block;margin-bottom:5px; }
  .ock-signoff-field input{ width:100%;padding:8px 10px;border:none;border-bottom:1.5px solid var(--steel-light);background:transparent;font-size:13.5px;font-family:'Inter',sans-serif; }
  .ock-signoff-field input:focus{ outline:none;border-bottom-color:var(--blue); }
  .ock-signoff-val{ font-size:13.5px;font-weight:500;padding:6px 0; }

  .ock-actionbar{ position:sticky;bottom:0;margin:20px -28px -30px;padding:13px 28px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;background:rgba(255,255,255,.94);backdrop-filter:blur(6px);border-top:1px solid var(--line); }
  .ock-save-status{ font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--steel); }
  .ock-save-status.dirty{ color:#B26A00;font-weight:600; }
  @media (max-width:640px){
    body{ padding:8px; } .ock-header,.ock-tabs,.ock-body{ padding-left:16px;padding-right:16px; }
    .ock-actionbar{ margin-left:-16px;margin-right:-16px;padding-left:16px;padding-right:16px; }
    .ock-signoff-grid{ grid-template-columns:1fr; } .ock-sub{ margin-left:0; } .ock-type-btn{ padding:9px 10px; }
  }
  @media (prefers-reduced-motion:reduce){ *,*::before,*::after{ animation-duration:.01ms !important;animation-iteration-count:1 !important;transition-duration:.01ms !important; } .ock-card{ opacity:1; } }
</style>

<div id="ock-app" class="ock-root"></div>

<script>
const storage = {
  async _call(url, opt, tries = 2){
    for(let i = 0; i < tries; i++){
      const ctl = new AbortController();
      const timer = setTimeout(() => ctl.abort(), 20000);
      try{
        const res = await fetch(url, Object.assign({ signal: ctl.signal }, opt));
        clearTimeout(timer);
        if(res.status === 409){
          const j = await res.json().catch(() => ({}));
          const err = new Error(j.error || 'Konflik data'); err.status = 409; throw err;
        }
        if(!res.ok) throw new Error('Server error (' + res.status + ')');
        return await res.json();
      }catch(e){
        clearTimeout(timer);
        if(e.status === 409 || i === tries - 1) throw (e.name === 'AbortError' ? new Error('Koneksi timeout, coba lagi') : e);
      }
    }
  },
  async get(key){
    const d = await this._call('/api/storage?key=' + encodeURIComponent(key));
    return (d.value === null || d.value === undefined) ? null : { key, value: d.value };
  },
  async bulk(){ return (await this._call('/api/storage?bulk=1')).items || {}; },
  async set(key, value){
    await this._call('/api/storage', { method:'POST', headers:{ 'Content-Type':'application/json' }, body: JSON.stringify({ key, value }) });
    return { key, value };
  },
  async delete(key){
    await this._call('/api/storage?key=' + encodeURIComponent(key), { method:'DELETE' });
    return { key, deleted: true };
  }
};
(function(){
  const LOGO_URL = '/images/logo-tatalogam.png';
  let LOGO_DATA_URI = null;
  function loadLogoForPdf(){
    fetch(LOGO_URL)
      .then(r => r.blob())
      .then(blob => new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onloadend = () => resolve(reader.result);
        reader.onerror = reject;
        reader.readAsDataURL(blob);
      }))
      .then(dataUrl => { LOGO_DATA_URI = dataUrl; })
      .catch(() => { /* logo optional in PDF if this fails */ });
  }
  loadLogoForPdf();
  const DEFAULT_CATEGORIES = ["Dokumen & Administrasi","Akses & Sistem","Perlengkapan Kerja","Orientasi & Proses Akhir"];

  const TYPES = {
    onboarding: { label:'Onboarding', full:'Checklist Karyawan Baru (Onboarding)', color:'#0054A7', bg:'#E3EEF9' },
    mutasi:     { label:'Mutasi & Rotasi', full:'Checklist Job Rotasi Karyawan (Mutasi / Promosi / Demosi)', color:'#5E8A0A', bg:'#EAF4D2' },
    resign:     { label:'Resign', full:'Checklist Karyawan Resign', color:'#5A6878', bg:'#E8EDF2' },
  };

  const DEFAULT_TEMPLATES = {
    onboarding: [
      {title:"Tanda tangan kontrak PKWT", category:"Dokumen & Administrasi"},
      {title:"Pengumpulan dokumen (KTP, NPWP, ijazah, rekening)", category:"Dokumen & Administrasi"},
      {title:"Pendaftaran BPJS Ketenagakerjaan & Kesehatan", category:"Dokumen & Administrasi"},
      {title:"Pembuatan akun Talenta (HRIS)", category:"Akses & Sistem"},
      {title:"Pembuatan email perusahaan", category:"Akses & Sistem"},
      {title:"Aktivasi akses WhatsApp HCM Chatbot", category:"Akses & Sistem"},
      {title:"ID card & akses masuk kantor / cabang", category:"Perlengkapan Kerja"},

      {title:"Update ID card / akses area kerja baru", category:"Perlengkapan Kerja"},
      {title:"Serah terima tugas & tanggung jawab (handover)", category:"Orientasi & Proses Akhir"},
      {title:"Informasi ke atasan lama & atasan baru", category:"Orientasi & Proses Akhir"},

      {title:"Surat pengunduran diri diterima", category:"Dokumen & Administrasi"},
      {title:"Perhitungan hak karyawan (pesangon, sisa cuti, dll)", category:"Dokumen & Administrasi"},
      {title:"Surat Keterangan Kerja (jika diminta)", category:"Dokumen & Administrasi"},
      {title:"Pelaporan WLKP/PHK ke Kementerian Ketenagakerjaan", category:"Dokumen & Administrasi"},
      {title:"Nonaktifkan akun & akses sistem (Talenta, email)", category:"Akses & Sistem"},
      {title:"Nonaktifkan akses WhatsApp HCM Chatbot", category:"Akses & Sistem"},
      {title:"Pengembalian aset perusahaan (laptop, ID card, dll)", category:"Perlengkapan Kerja"},
      {title:"Exit interview", category:"Orientasi & Proses Akhir"},
      {title:"Clearance sheet ditandatangani semua pihak terkait", category:"Orientasi & Proses Akhir"},
    ],
  };

  let state = {
    type: 'onboarding', tab: 'aktif', templates: {}, categories: {}, employees: [],
    activeId: null, viewRev: 'draft', dirty: false, loading: true, loadError: null, modal: null, busy: false,
  };

  function uid(p){ return p + "_" + Math.random().toString(36).slice(2,9); }
  function esc(s){ return (s||'').toString().replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
  function slug(s){ return s.toLowerCase().replace(/[^a-z0-9]+/g,'-'); }
  function todayISO(){ return new Date().toISOString().slice(0,10); }
  function clone(o){ return JSON.parse(JSON.stringify(o)); }
  function fmtDT(iso){ if(!iso) return '-'; const d = new Date(iso); return isNaN(d) ? esc(iso) : d.toLocaleString('id-ID',{day:'numeric',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'}); }
  function revLabel(n){ return n===0 ? 'Asli' : 'Revisi ' + n; }
  function parseRev(x){ return x==='draft' ? 'draft' : Number(x); }

  function showToast(msg, kind){
    let t = document.getElementById('ock-toast');
    if(!t){ t = document.createElement('div'); t.id = 'ock-toast'; document.body.appendChild(t); }
    t.className = 'ock-toast ' + (kind||''); t.textContent = msg;
    void t.offsetWidth; t.classList.add('show');
    clearTimeout(showToast._t); showToast._t = setTimeout(()=>t.classList.remove('show'), 2800);
  }

  // ---------- DATA MODEL ----------
  // emp.draft     = salinan kerja (Simpan Progress). null jika tidak ada yang sedang dikerjakan.
  // emp.revisions = riwayat FINAL (Asli, Revisi 1, 2, ...). Append-only, tidak bisa diubah.
  function tplCopy(type){ return clone(state.templates[type] || []); }
  function catsCopy(type){ return (state.categories[type] || []).slice(); }
  function emptySign(){ return {pic:'', ttd:'', date:''}; }

  function normalize(e){
    let migratedDone = false;
    if(!Array.isArray(e.revisions)){
      let so = e.signOff || emptySign();
      if(so.name!==undefined && so.pic===undefined) so = {pic:so.name||'', ttd:'', date:so.date||''};
      const base = { checklist: e.checklist || {}, signOff: so };
      e.revisions = []; e.draft = null;
      if(e.status === 'selesai'){
        e.revisions.push({ no:0, completedAt: so.date || e.createdAt, reason:'', checklist:base.checklist, signOff:base.signOff, items:tplCopy(e.formType), cats:catsCopy(e.formType) });
        migratedDone = true;
      }else{ e.draft = base; }
      delete e.checklist; delete e.signOff;
    }
    e._base = e.updatedAt || '';
    return { emp: e, migratedDone };
  }

  function view(e, no){
    if(no === 'draft' && e.draft){
      const d = e.draft;
      return { no:'draft', checklist:d.checklist, signOff:d.signOff, items:state.templates[e.formType]||[], cats:state.categories[e.formType]||[],
               label: d.basedOn!==undefined ? 'Draft Revisi' : 'Draft', done:false, rev:null };
    }
    const r = e.revisions[no];
    return { no, checklist:r.checklist, signOff:r.signOff||emptySign(), items:r.items, cats:r.cats, label:revLabel(no), done:true, rev:r };
  }
  function defaultView(e){ return e.draft ? view(e,'draft') : view(e, e.revisions.length-1); }

  async function persist(emp){
    // cek konflik: data di server tidak boleh sudah berubah dari yang kita baca
    const cur = await storage.get('employee:'+emp.id);
    if(cur){
      const s = JSON.parse(cur.value);
      if((s.updatedAt||'') !== (emp._base||'')){ const err = new Error('conflict'); err.conflict = true; throw err; }
    }
    const out = clone(emp); delete out._base; out.updatedAt = new Date().toISOString();
    await storage.set('employee:'+emp.id, JSON.stringify(out));
    emp.updatedAt = out.updatedAt; emp._base = out.updatedAt;
  }

  async function reloadEmployee(id){
    const cur = await storage.get('employee:'+id);
    const i = state.employees.findIndex(e=>e.id===id);
    if(!cur){ if(i>-1) state.employees.splice(i,1); state.activeId = null; return; }
    const n = normalize(JSON.parse(cur.value)).emp;
    if(i>-1) state.employees[i] = n; else state.employees.unshift(n);
    state.dirty = false;
    if(state.activeId===id && state.viewRev==='draft' && !n.draft) state.viewRev = Math.max(0, n.revisions.length-1);
  }

  async function handleSaveError(err, empId){
    if(err && err.conflict){
      if(confirm('Data ini sudah diubah di perangkat/tab lain.\n\nMuat data terbaru? (perubahan di layar ini yang belum tersimpan akan hilang)')){
        try{ await reloadEmployee(empId); }catch(e){}
        render();
      }
    }else{
      showToast('Gagal menyimpan: ' + (err && err.message ? err.message : 'periksa koneksi'), 'err');
    }
  }

  async function loadAll(){
    state.loading = true; state.loadError = null; render();
    try{
      const items = await storage.bulk();
      const pending = [];
      for(const key of Object.keys(TYPES)){
        let cats = null, tpl = null;
        try{ if(items['categories:'+key]) cats = JSON.parse(items['categories:'+key]); }catch(e){}
        try{ if(items['template:'+key]) tpl = JSON.parse(items['template:'+key]); }catch(e){}
        if(!cats){ cats = DEFAULT_CATEGORIES.slice(); pending.push(storage.set('categories:'+key, JSON.stringify(cats))); }
        if(!tpl){ tpl = DEFAULT_TEMPLATES[key].map((t,i)=>({id:uid('itm'),title:t.title,category:t.category,order:i})); pending.push(storage.set('template:'+key, JSON.stringify(tpl))); }
        state.categories[key] = cats; state.templates[key] = tpl;
      }
      const emps = [], migrate = [];
      Object.keys(items).filter(k=>k.indexOf('employee:')===0).forEach(k=>{
        try{
          const r = normalize(JSON.parse(items[k]));
          emps.push(r.emp); if(r.migratedDone) migrate.push(r.emp);
        }catch(e){ console.warn('Data rusak dilewati:', k); }
      });
      emps.sort((a,b)=>(b.createdAt||'').localeCompare(a.createdAt||''));
      state.employees = emps;
      Promise.all(pending).catch(()=>{});
      migrate.forEach(e=>persist(e).catch(()=>{}));   // kunci riwayat lama ke format baru
    }catch(e){
      state.loading = false; state.loadError = e.message || 'Tidak bisa terhubung ke server'; render(); return;
    }
    state.loading = false; render();
  }

  async function saveTemplate(type){ await storage.set('template:'+type, JSON.stringify(state.templates[type])); }
  async function saveCategories(type){ await storage.set('categories:'+type, JSON.stringify(state.categories[type])); }
  function currentTemplate(){ return state.templates[state.type] || []; }
  function currentCategories(){ return state.categories[state.type] || []; }
  function typedEmployees(){ return state.employees.filter(e=>e.formType===state.type); }
  function leaveOk(){
    if(state.dirty && !confirm('Ada perubahan yang belum disimpan. Tinggalkan halaman ini tanpa menyimpan?')) return false;
    state.dirty = false; return true;
  }
  window.addEventListener('beforeunload', e=>{ if(state.dirty){ e.preventDefault(); e.returnValue=''; } });

  function metaLine(emp){
    if(emp.formType==='onboarding') return 'Mulai kerja: ' + esc(emp.meta.startDate||'-');
    if(emp.formType==='mutasi') return esc(emp.meta.changeType||'-') + ' → ' + esc(emp.meta.newPosition||'-') + ' · Efektif: ' + esc(emp.meta.effectiveDate||'-');
    if(emp.formType==='resign') return 'Resign: ' + esc(emp.meta.resignDate||'-') + (emp.meta.reason? ' · '+esc(emp.meta.reason):'');
    return '';
  }

  function computeProgress(emp, v){
    v = v || defaultView(emp);
    const total = v.items.length || 1;
    const done = v.items.filter(it => v.checklist[it.id] && v.checklist[it.id].done).length;
    return {done, total, pct: Math.round((done/total)*100)};
  }

  // ---------- RENDER ----------
  function render(){
    const app = document.getElementById('ock-app');
    const y = window.scrollY;
    if(state.loading){
      app.innerHTML = `<div class="ock-boot"><img src="/images/logo-tatalogam.png" alt=""><div class="ock-boot-bar"><i></i></div><div>Memuat data…</div></div>`; return;
    }
    if(state.loadError){
      app.innerHTML = `<div class="ock-boot"><div class="big">Data gagal dimuat</div><div class="sub">${esc(state.loadError)}</div><button class="ock-btn safety" onclick="OCK.reload()">Coba Lagi</button></div>`; return;
    }
    app.innerHTML = `
      <div class="ock-header">
        <div class="ock-title"><span class="mark"><img src="/images/logo-tatalogam.png" alt="Tatalogam Group" /></span>Checklist Digital Human Capital</div>
        <div class="ock-sub">PT TATALOGAM GROUP — 1 LINK, 3 JENIS PROSES</div>
        <div class="ock-type-switch">${Object.keys(TYPES).map(k=>typeBtn(k)).join('')}</div>
        <div class="ock-header-actions">
          <button class="ock-btn-export-all" onclick="OCK.exportAllPDF()">Export Semua sebagai PDF (Onboarding + Mutasi + Resign)</button>
        </div>
      </div>
      <div class="ock-tabs">${tabBtn('aktif','Aktif')}${tabBtn('riwayat','Riwayat')}${tabBtn('admin','Panel Admin')}</div>
      <div class="ock-body" id="ock-body">
        ${state.tab==='aktif' ? renderAktif() : ''}
        ${state.tab==='riwayat' ? renderRiwayat() : ''}
        ${state.tab==='admin' ? renderAdmin() : ''}
        ${state.activeId ? renderDetail() : ''}
      </div>
      ${state.modal==='new-employee' ? renderNewEmployeeModal() : ''}
      ${state.modal==='revision' ? renderRevisionModal() : ''}
    `;
    window.scrollTo(0, y);
    const emp = state.activeId && state.employees.find(e=>e.id===state.activeId);
    if(emp && state.viewRev==='draft' && emp.draft && !state.modal) requestAnimationFrame(()=>setupSignaturePad(emp.id));
  }

  function typeBtn(key){
    const t = TYPES[key];
    return `<button class="ock-type-btn ${state.type===key?'active':''}" style="--type-color:${t.color}" onclick="OCK.setType('${key}')">
      <div class="t1">${key==='onboarding'?'01 · KARYAWAN BARU':key==='mutasi'?'02 · MUTASI/ROTASI':'03 · RESIGN'}</div>
      <div class="t2">${t.label}</div>
    </button>`;
  }
  function tabBtn(key,label){ return `<button class="ock-tab ${state.tab===key?'active':''}" onclick="OCK.setTab('${key}')">${label}</button>`; }

  function renderAktif(){
    if(state.activeId) return '';
    const list = typedEmployees().filter(e=>e.draft);
    const body = list.length===0
      ? `<div class="ock-empty"><div class="big">Belum ada proses ${esc(TYPES[state.type].label)} yang aktif</div>Buat proses baru untuk mulai checklist-nya.</div>`
      : `<div class="ock-grid">${list.map((e,i)=>cardHtml(e,i)).join('')}</div>`;
    return `
      <div class="ock-row-between">
        <div class="ock-h2">${esc(TYPES[state.type].full)} <span style="color:var(--steel);font-weight:400;font-size:12.5px;">(${list.length} aktif)</span></div>
        <button class="ock-btn safety" onclick="OCK.openNewEmployee()">+ Buat Proses Baru</button>
      </div>${body}`;
  }

  function cardHtml(emp, i){
    const p = computeProgress(emp, view(emp,'draft'));
    const isRev = emp.draft.basedOn !== undefined;
    return `
      <div class="ock-card" style="--i:${i}" onclick="OCK.openDetail('${emp.id}','draft')">
        <span class="ock-status-pill ${isRev?'rev':'progress'}">${isRev?'REVISI '+emp.revisions.length+' · DRAFT':'DRAFT · BERJALAN'}</span>
        <div class="ock-card-name" style="margin-top:9px;">${esc(emp.name)}</div>
        <div class="ock-card-pos">${esc(emp.position)}${emp.branch? ' · '+esc(emp.branch):''}</div>
        <div class="ock-progress-wrap"><div class="ock-progress-fill" style="width:${p.pct}%"></div></div>
        <div class="ock-progress-label">${p.done}/${p.total} item · ${p.pct}%${emp.draft.savedAt?' · tersimpan':' · belum disimpan'}</div>
        <div class="ock-card-meta">${metaLine(emp).toUpperCase()}</div>
      </div>`;
  }

  function renderRiwayat(){
    if(state.activeId) return '';
    const list = typedEmployees().filter(e=>e.revisions.length);
    if(list.length===0){
      return `<div class="ock-row-between"><div class="ock-h2">Riwayat — ${esc(TYPES[state.type].label)}</div></div>
        <div class="ock-empty"><div class="big">Belum ada riwayat</div>Proses yang sudah diselesaikan akan muncul di sini (hanya bisa dilihat, tidak bisa diedit langsung).</div>`;
    }
    const rows = list.map(emp=>{
      const last = emp.revisions[emp.revisions.length-1];
      const p = computeProgress(emp, view(emp, last.no));
      return `<tr>
        <td><b>${esc(emp.name)}</b></td><td>${esc(emp.position)}</td><td>${esc(emp.branch||'-')}</td>
        <td style="font-size:11.5px;">${metaLine(emp)}</td>
        <td><span class="ock-status-pill done">SELESAI · ${esc(revLabel(last.no)).toUpperCase()}</span>${emp.draft?' <span class="ock-status-pill rev">REVISI DRAFT</span>':''}</td>
        <td style="font-size:11.5px;">${fmtDT(last.completedAt)}</td>
        <td>${p.done}/${p.total}</td>
        <td><button class="ock-link-btn" onclick="OCK.openDetail('${emp.id}',${last.no})">Lihat</button> ·
            <button class="ock-link-btn" onclick="OCK.exportPDF('${emp.id}','${last.no}')">PDF</button></td>
      </tr>`;
    }).join('');
    return `
      <div class="ock-row-between">
        <div class="ock-h2">Riwayat — ${esc(TYPES[state.type].label)} <span style="color:var(--steel);font-weight:400;font-size:12.5px;">(${list.length})</span></div>
        <button class="ock-btn ghost" onclick="OCK.exportExcelAll()">Export Excel (jenis ini)</button>
      </div>
      <div style="overflow-x:auto;"><table class="ock-table">
        <thead><tr><th>Nama</th><th>Posisi</th><th>Cabang</th><th>Info</th><th>Versi</th><th>Diselesaikan</th><th>Item</th><th>Aksi</th></tr></thead>
        <tbody>${rows}</tbody></table></div>`;
  }

  function renderAdmin(){
    if(state.activeId) return '';
    const tpl = currentTemplate();
    const cats = currentCategories();

    const catMgmt = `
      <div class="ock-cat-mgmt">
        <div class="ock-cat-title" style="margin-bottom:10px;">Kelola Sub Pertanyaan / Kategori</div>
        <div class="ock-admin-list">
          ${cats.map((cat,idx)=>{
            const count = tpl.filter(i=>i.category===cat).length;
            return `
              <div class="ock-admin-row">
                <div class="ock-order-btns">
                  <button onclick="OCK.moveCategory('${esc(cat)}',-1)" ${idx===0?'disabled':''}>▲</button>
                  <button onclick="OCK.moveCategory('${esc(cat)}',1)" ${idx===cats.length-1?'disabled':''}>▼</button>
                </div>
                <input type="text" value="${esc(cat)}" onchange="OCK.renameCategory('${esc(cat)}', this.value)" />

                <button class="ock-btn danger-ghost small" onclick="OCK.deleteCategory('${esc(cat)}')">Hapus</button>
              </div>
            `;
          }).join('')}
        </div>
        <div style="margin-top:8px;">
          <input type="text" id="new-cat-input" placeholder="Tambah kategori / sub pertanyaan baru..." style="width:68%;padding:8px 10px;border:1px solid var(--line);border-radius:7px;font-size:12.5px;font-family:'Inter',sans-serif;" />
          <button class="ock-btn ghost small" onclick="OCK.addCategory('new-cat-input')">+ Tambah Kategori</button>
        </div>
      </div>
    `;

              <div class="ock-admin-row">

                  <button onclick="OCK.moveItem('${it.id}',-1)" ${idx===0?'disabled':''}>▲</button>

            `).join('') || '<div style="color:var(--steel-light);font-size:12px;padding:6px 2px;">Belum ada item.</div>'}
          </div>

            <button class="ock-btn ghost small" onclick="OCK.addItem('${esc(cat)}','new-item-${slug(cat)}')">+ Tambah</button>
          </div>

      ${catMgmt}

      ${groups}
    `;
  }

  function renderDetail(){
    const emp = state.employees.find(e=>e.id===state.activeId);
    if(!emp) return '';
    if(state.viewRev==='draft' && !emp.draft) state.viewRev = emp.revisions.length-1;
    const vn = state.viewRev, editing = vn==='draft';
    const v = view(emp, vn), p = computeProgress(emp, v), T = TYPES[emp.formType];
    const chip = (no,label,a)=>`<button class="ock-chip ${a?'active':''}" onclick="OCK.setViewRev('${no}')">${esc(label)}</button>`;
    const chips = (emp.revisions.length ? `<div class="ock-chips">${emp.revisions.map(r=>chip(r.no,revLabel(r.no),vn===r.no)).join('')}${emp.draft?chip('draft',emp.draft.basedOn!==undefined?'Draft Revisi':'Draft',editing):''}</div>` : '');

    let banner = '';
    if(editing && emp.draft.basedOn!==undefined){
      banner = `<div class="ock-banner warn"><span>Sedang mengerjakan <b>Revisi ${emp.revisions.length}</b> (dari ${esc(revLabel(emp.draft.basedOn))}). Alasan: ${esc(emp.draft.reason||'-')}. Versi sebelumnya tetap tersimpan utuh.</span></div>`;
    }else if(!editing){
      banner = `<div class="ock-banner"><span>🔒 <b>${esc(v.label)}</b> — diselesaikan ${fmtDT(v.rev.completedAt)}. Hanya bisa dilihat.${v.rev.reason?' Alasan revisi: '+esc(v.rev.reason):''}</span>${emp.draft?`<button class="ock-btn small safety" onclick="OCK.setViewRev('draft')">Lanjutkan Draft Revisi</button>`:''}</div>`;
    }

    const groups = v.cats.map(cat=>{
      const items = v.items.filter(i=>i.category===cat).sort((a,b)=>a.order-b.order);
      if(!items.length) return '';
      return `<div class="ock-cat-block"><div class="ock-cat-title">${esc(cat)}</div>${items.map(it=>{
        const st = v.checklist[it.id] || {done:false, note:''};
        if(!editing) return `<div class="ock-item"><div class="ock-stamp ro ${st.done?'checked':''}">${st.done?'✓':''}</div><div style="flex:1;"><div class="ock-item-title ${st.done?'done':''}">${esc(it.title)}</div>${st.note?`<div class="ock-ro-note">${esc(st.note)}</div>`:''}</div></div>`;
        return `<div class="ock-item"><div class="ock-stamp ${st.done?'checked':''}" onclick="OCK.toggleItem('${emp.id}','${it.id}')">${st.done?'✓':''}</div>
          <div style="flex:1;"><div class="ock-item-title ${st.done?'done':''}">${esc(it.title)}</div>
          <input class="ock-item-note" placeholder="Catatan (opsional)" value="${esc(st.note)}" oninput="OCK.setNote('${emp.id}','${it.id}', this.value)" /></div></div>`;
      }).join('')}</div>`;
    }).join('');

    const so = v.signOff || emptySign();
    const signoff = editing ? `
      <div class="ock-signoff"><div class="ock-signoff-title">Pengesahan Formulir</div>

  function setupSignaturePad(empId){
    const canvas = document.getElementById('sigpad-'+empId);
    if(!canvas) return;
    const ctx = canvas.getContext('2d');
    if(!ctx) return;
    if(OCK._sigOff){ OCK._sigOff(); OCK._sigOff=null; }
    const emp = state.employees.find(e=>e.id===empId);
    const so = emp && emp.draft ? emp.draft.signOff : {ttd:''};
    ctx.clearRect(0,0,canvas.width,canvas.height);
    ctx.strokeStyle = '#071C36';
    ctx.lineWidth = 2.4;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';

    if(so.ttd){
      const img = new Image();
      img.onload = ()=>{ ctx.drawImage(img,0,0,canvas.width,canvas.height); };
      img.src = so.ttd;
    }

    let drawing = false;
    let last = null;

    function posFromEvent(e){
      const rect = canvas.getBoundingClientRect();
      const scaleX = canvas.width / rect.width;
      const scaleY = canvas.height / rect.height;
      const point = e.touches ? e.touches[0] : e;
      return { x: (point.clientX - rect.left) * scaleX, y: (point.clientY - rect.top) * scaleY };
    }

    function start(e){ e.preventDefault(); drawing = true; last = posFromEvent(e); }
    function move(e){
      if(!drawing) return;
      e.preventDefault();
      const p = posFromEvent(e);
      ctx.beginPath();
      ctx.moveTo(last.x, last.y);
      ctx.lineTo(p.x, p.y);
      ctx.stroke();
      last = p;
    }
    async function end(e){
      if(!drawing) return;
      drawing = false;
      const dataUrl = canvas.toDataURL('image/png');
      OCK.setSignOff(empId, 'ttd', dataUrl);
      const ph = canvas.parentNode.querySelector('.ock-sigpad-placeholder'); if(ph) ph.remove();
    }

    canvas.addEventListener('mousedown', start);
    canvas.addEventListener('mousemove', move);
    window.addEventListener('mouseup', end);
    canvas.addEventListener('touchstart', start, {passive:false});
    canvas.addEventListener('touchmove', move, {passive:false});
    canvas.addEventListener('touchend', end);
    OCK._sigOff = ()=>window.removeEventListener('mouseup', end);
  }

  // ---------- ACTIONS ----------
  const OCK = {

    setType(t){ if(!leaveOk()) return; state.type=t; state.tab='aktif'; state.activeId=null; render(); },
    setTab(t){ if(!leaveOk()) return; state.tab=t; state.activeId=null; render(); },

    async createEmployee(){

    // --- edit draft (hanya di memori; disimpan lewat "Simpan Progress") ---
    _draft(empId){ const e=state.employees.find(x=>x.id===empId); return e && e.draft ? e : null; },
    toggleItem(empId, itemId){
      const e=OCK._draft(empId); if(!e) return;
      const cur = e.draft.checklist[itemId] || {done:false, note:''};
      cur.done = !cur.done; e.draft.checklist[itemId] = cur;

    },
    setNote(empId, itemId, val){
      const e=OCK._draft(empId); if(!e) return;
      const cur = e.draft.checklist[itemId] || {done:false, note:''};
      cur.note = val; e.draft.checklist[itemId] = cur;
      state.dirty = true; refreshSaveStatus();
    },
    setSignOff(empId, field, val){
      const e=OCK._draft(empId); if(!e) return;
      e.draft.signOff[field] = val; state.dirty = true; refreshSaveStatus();
    },
    clearSignature(empId){
      const e=OCK._draft(empId); if(!e) return;
      e.draft.signOff.ttd=''; state.dirty=true; render();
    },

    async saveProgress(empId){
      const e=OCK._draft(empId); if(!e || state.busy) return;
      state.busy=true; const prev=e.draft.savedAt; e.draft.savedAt=new Date().toISOString();
      try{
        await persist(e); state.dirty=false; showToast('Progress tersimpan. Bisa dilanjutkan nanti.');
      }catch(err){ e.draft.savedAt=prev; await handleSaveError(err, empId); }
      state.busy=false; render();
    },

    async complete(empId){
      const e=OCK._draft(empId); if(!e || state.busy) return;
      const d=e.draft, v=view(e,'draft'), p=computeProgress(e,v);
      if(!d.signOff.pic.trim()){ showToast('Isi Nama PIC dulu sebelum menyelesaikan','err'); return; }
      if(!d.signOff.ttd){ showToast('Tanda tangan (TTD) wajib sebelum menyelesaikan','err'); return; }
      const warn = p.pct<100 ? '\n\nPerhatian: masih ada '+(p.total-p.done)+' item yang belum dicentang.' : '';
      if(!confirm('Tandai SELESAI?\n\nSetelah selesai, data dikunci dan tidak bisa diedit langsung (perubahan hanya lewat Buat Revisi).'+warn)) return;
      state.busy=true;
      const backup = clone(e);
      const sign = clone(d.signOff); if(!sign.date) sign.date=todayISO();
      const no = e.revisions.length;
      e.revisions.push({ no, completedAt:new Date().toISOString(), reason:d.reason||'', basedOn:d.basedOn,
                         checklist:clone(d.checklist), signOff:sign, items:clone(v.items), cats:v.cats.slice() });
      e.draft=null; e.status='selesai';
      try{
        await persist(e); state.dirty=false; state.viewRev=no; showToast('Selesai & terkunci ('+revLabel(no)+')');
      }catch(err){
        const i=state.employees.findIndex(x=>x.id===empId); backup._base=e._base; state.employees[i]=backup;
        await handleSaveError(err, empId);
      }
      state.busy=false; render();
    },

    async startRevision(){
      const e=state.employees.find(x=>x.id===state.activeId); if(!e || e.draft) return;
      const reason=(document.getElementById('f-reason').value||'').trim();
      if(reason.length<5){ showToast('Isi alasan revisi (min. 5 karakter)','err'); return; }
      const last=e.revisions[e.revisions.length-1];
      e.draft={ checklist:clone(last.checklist), signOff:{pic:last.signOff.pic, ttd:'', date:''}, basedOn:last.no, reason };
      e.status='revisi';
      try{ await persist(e); state.modal=null; state.viewRev='draft'; state.dirty=false; showToast('Draft revisi dibuat'); }
      catch(err){ e.draft=null; e.status='selesai'; state.modal=null; await handleSaveError(err, e.id); }
      render();
    },

    async discardRevision(empId){
      const e=OCK._draft(empId); if(!e) return;
      if(!confirm('Batalkan draft revisi ini? Versi yang sudah selesai tidak terpengaruh.')) return;
      const backup=e.draft; e.draft=null; e.status='selesai';
      try{ await persist(e); state.dirty=false; state.viewRev=e.revisions.length-1; showToast('Draft revisi dibatalkan'); }
      catch(err){ e.draft=backup; e.status='revisi'; await handleSaveError(err, empId); }
      render();
    },

    async deleteEmployee(empId){
      const e=state.employees.find(x=>x.id===empId); if(!e) return;
      if(e.revisions.length){
        const t=prompt('Ini akan menghapus PERMANEN seluruh riwayat '+e.name+'.\nKetik nama karyawan untuk konfirmasi:');
        if(t===null || t.trim().toLowerCase()!==e.name.trim().toLowerCase()){ if(t!==null) showToast('Nama tidak cocok, batal dihapus','err'); return; }
      }else if(!confirm('Hapus proses ini?')) return;
      try{

    async renameCategory(oldName, newVal){
      const newName = newVal.trim();
      if(!newName || newName===oldName) { render(); return; }
      const cats = state.categories[state.type];
      const idx = cats.indexOf(oldName);
      if(idx===-1) return;
      if(cats.includes(newName)){ showToast('Nama kategori sudah dipakai'); render(); return; }
      cats[idx] = newName;
      const tpl = currentTemplate();
      tpl.forEach(it=>{ if(it.category===oldName) it.category = newName; });
      render();
      await saveCategories(state.type);
      await saveTemplate(state.type);
      showToast('Kategori diubah');
    },

    async deleteCategory(name){
      const tpl = currentTemplate();
      const hasItems = tpl.some(it=>it.category===name);
      if(hasItems){ showToast('Hapus/pindahkan item di kategori ini dulu sebelum menghapus kategorinya'); return; }
      if(!confirm('Hapus kategori "'+name+'"?')) return;
      state.categories[state.type] = state.categories[state.type].filter(c=>c!==name);
      render();
      await saveCategories(state.type);
      showToast('Kategori dihapus');
    },

    async moveCategory(name, dir){
      const cats = state.categories[state.type];
      const idx = cats.indexOf(name);
      const swapIdx = idx+dir;
      if(idx===-1 || swapIdx<0 || swapIdx>=cats.length) return;
      const tmp = cats[idx]; cats[idx] = cats[swapIdx]; cats[swapIdx] = tmp;
      render();
      await saveCategories(state.type);
    },

    async addItem(cat, inputId){
      const el = document.getElementById(inputId);
      const title = el.value.trim();
      if(!title) return;
      const tpl = currentTemplate();
      const orders = tpl.filter(i=>i.category===cat).map(i=>i.order);
      const nextOrder = orders.length? Math.max(...orders)+1 : 0;
      tpl.push({id: uid('itm'), title, category: cat, order: nextOrder});
      render();
      await saveTemplate(state.type);
      showToast('Item ditambahkan');
    },

    async editItemTitle(itemId, val){
      const it = currentTemplate().find(i=>i.id===itemId);
      if(!it) return;
      it.title = val;
      await saveTemplate(state.type);
    },

    async deleteItem(itemId){
      if(!confirm('Hapus item checklist ini dari template?')) return;
      state.templates[state.type] = currentTemplate().filter(i=>i.id!==itemId);
      render();
      await saveTemplate(state.type);
    },

    async moveItem(itemId, dir){
      const tpl = currentTemplate();
      const it = tpl.find(i=>i.id===itemId);
      if(!it) return;
      const siblings = tpl.filter(i=>i.category===it.category).sort((a,b)=>a.order-b.order);
      const idx = siblings.findIndex(i=>i.id===itemId);
      const swapIdx = idx+dir;
      if(swapIdx<0 || swapIdx>=siblings.length) return;
      const a = siblings[idx], b = siblings[swapIdx];
      const tmp = a.order; a.order = b.order; b.order = tmp;
      render();
      await saveTemplate(state.type);
    },

      doc.setFont('helvetica','bold'); doc.setFontSize(8);
      doc.text('Info', marginX+5, y+31);
      doc.setFont('helvetica','normal'); doc.setFontSize(8.5); doc.setTextColor(90);
      doc.text(': ' + metaLineForPdf(emp), marginX+18, y+31, { maxWidth: pageWidth-marginX*2-24 });
      doc.setTextColor(0);
      y += boxH + 7;

      // Checklist table — kiri "Pertanyaan", kanan "Jawaban" (status + catatan digabung aman, tidak tertimpa)
      const body = [];
      let rowNo = 1;
      cats.forEach(cat=>{
        const items = tpl.filter(i=>i.category===cat).sort((a,b)=>a.order-b.order);
        if(items.length===0) return;
        body.push([{ content: cat.toUpperCase(), colSpan: 3, styles: { fillColor:[243,241,236], textColor:[91,101,114], fontStyle:'bold', fontSize:8 } }]);
        items.forEach(it=>{
          const st = v.checklist[it.id] || { done:false, note:'' };
          const jawaban = (st.done ? 'Selesai' : 'Belum dikerjakan') + (st.note ? ('\nCatatan: ' + st.note) : '');
          body.push([ rowNo++, it.title, jawaban ]);
        });
      });

      doc.autoTable({
        startY: y,
        head: [['No', 'Pertanyaan / Item Checklist', 'Jawaban']],
        body: body,
        theme: 'grid',
        margin: { left: marginX, right: marginX, bottom: 20 },
        headStyles: { fillColor:[0,84,167], textColor:255, fontSize:8.5, halign:'center' },
        styles: { fontSize:8.5, cellPadding:3, lineColor:[222,218,208], textColor:[34,38,44], valign:'top' },
        columnStyles: {
          0: { cellWidth: 9, halign:'center', textColor:[91,101,114] },
          1: { cellWidth: 'auto' },
          2: { cellWidth: 46 },
        },
        didParseCell: function(data){
          if(data.section==='body' && data.column.index===2 && typeof data.cell.raw==='string'){
            if(data.cell.raw.indexOf('Selesai')===0){ data.cell.styles.textColor=[47,143,91]; }
            else if(data.cell.raw.indexOf('Belum')===0){ data.cell.styles.textColor=[194,75,63]; }
          }
        },
      });

      let finalY = doc.lastAutoTable.finalY + 10;
      if(finalY > pageHeight - 55){ doc.addPage(); finalY = 24; }

      // Sign-off box
      const signH = 42;
      doc.setDrawColor(200); doc.setFillColor(255,255,255);
      doc.roundedRect(marginX, finalY, pageWidth-marginX*2, signH, 2, 2, 'D');
      doc.setFont('helvetica','bold'); doc.setFontSize(9); doc.setTextColor(34,38,44);
      doc.text('PENGESAHAN FORMULIR', marginX+6, finalY+8);
      doc.setFont('helvetica','normal'); doc.setFontSize(9);
      doc.text('Nama PIC : ' + (so.pic || '________________________'), marginX+6, finalY+16);
      doc.text('Tanggal   : ' + (so.date || '____________'), marginX+6, finalY+23);
      doc.setFont('helvetica','bold'); doc.setFontSize(8.5);
      doc.text('TTD', pageWidth-marginX-45, finalY+8);
      doc.setDrawColor(200);
      doc.rect(pageWidth-marginX-55, finalY+11, 50, 24);
      if(so.ttd && so.ttd.indexOf('data:image')===0){
        try{ doc.addImage(so.ttd, 'PNG', pageWidth-marginX-53, finalY+13, 46, 20); }catch(err){}
      }
    },

    drawPdfFooter(doc){
      const pageWidth = doc.internal.pageSize.getWidth();
      const pageHeight = doc.internal.pageSize.getHeight();
      const marginX = 14;
      const pageCount = doc.internal.getNumberOfPages();
      for(let i=1;i<=pageCount;i++){
        doc.setPage(i);
        doc.setDrawColor(220);
        doc.line(marginX, pageHeight-14, pageWidth-marginX, pageHeight-14);
        doc.setFont('helvetica','normal'); doc.setFontSize(7.5); doc.setTextColor(140);
        doc.text('Dicetak otomatis — Sistem Checklist Digital Human Capital, PT Tatalogam Group', marginX, pageHeight-9);
        doc.text('Halaman ' + i + ' / ' + pageCount, pageWidth-marginX, pageHeight-9, { align:'right' });
        doc.setTextColor(0);
      }
    },

    exportPDF(empId, rev){
      const emp = state.employees.find(e=>e.id===empId);
      if(!emp || !window.jspdf){ showToast('Gagal export PDF (library belum termuat)','err'); return; }
      const v = rev===undefined ? defaultView(emp) : view(emp, parseRev(rev));
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF();
      OCK.renderEmployeePageToDoc(doc, emp, v);
      OCK.drawPdfFooter(doc);
      doc.save(TYPES[emp.formType].label.replace(/\s+/g,'_') + '_' + emp.name.replace(/\s+/g,'_') + '_' + v.label.replace(/\s+/g,'') + '.pdf');
      showToast('PDF diunduh');
    },

    exportAllPDF(){
      if(!window.jspdf){ showToast('Gagal export PDF (library belum termuat)','err'); return; }
      if(state.employees.length===0){ showToast('Belum ada data sama sekali'); return; }
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF();
      const order = ['onboarding','mutasi','resign'];
      const sorted = state.employees.slice().sort((a,b)=>{
        const ta = order.indexOf(a.formType), tb = order.indexOf(b.formType);
        if(ta!==tb) return ta-tb;
        return (a.createdAt||'').localeCompare(b.createdAt||'');
      });
      sorted.forEach((emp, idx)=>{
        if(idx>0) doc.addPage();
        OCK.renderEmployeePageToDoc(doc, emp, defaultView(emp));
      });
      OCK.drawPdfFooter(doc);
      doc.save('Rekap_Semua_Checklist_HC_Tatalogam.pdf');
      showToast('PDF gabungan (' + sorted.length + ' proses) diunduh');
    },

    exportExcelAll(){
      const list = typedEmployees();
      if(!window.XLSX || list.length===0){ showToast('Belum ada data untuk diexport'); return; }
      const summary = list.map(emp=>{
        const v = defaultView(emp), p = computeProgress(emp, v);
        const so = v.signOff || {pic:'', ttd:'', date:''};
        return {
          Nama: emp.name, Posisi: emp.position, Cabang: emp.branch||'-',
          Info: metaLine(emp),
          Status: v.done?('Selesai ('+v.label+')'):'Draft',
          'Progress (%)': p.pct, 'Item Selesai': p.done, 'Total Item': p.total,
          'Nama PIC': so.pic||'', 'TTD': so.ttd ? 'Sudah tanda tangan (lihat PDF)' : 'Belum', 'Tanggal Pengisian': so.date||''
        };
      });
      const detail = [];
      list.forEach(emp=>{
        const v = defaultView(emp);
        v.cats.forEach(cat=>{
          v.items.filter(i=>i.category===cat).sort((a,b)=>a.order-b.order).forEach(it=>{
            const st = v.checklist[it.id] || {done:false, note:''};
            detail.push({ Nama: emp.name, Kategori: cat, Item: it.title, Status: st.done?'Selesai':'Belum', Catatan: st.note||'' });
          });
        });
      });
      const wb = window.XLSX.utils.book_new();
      window.XLSX.utils.book_append_sheet(wb, window.XLSX.utils.json_to_sheet(summary), 'Ringkasan');
      window.XLSX.utils.book_append_sheet(wb, window.XLSX.utils.json_to_sheet(detail), 'Detail Item');
      window.XLSX.writeFile(wb, TYPES[state.type].label.replace(/\s+/g,'_') + '_Tatalogam.xlsx');
      showToast('Excel diunduh');
    },
  };

  function metaLineForPdf(emp){
    if(emp.formType==='onboarding') return 'Tanggal Mulai Kerja: ' + (emp.meta.startDate||'-');
    if(emp.formType==='mutasi') return 'Jenis: ' + (emp.meta.changeType||'-') + '  |  Posisi Baru: ' + (emp.meta.newPosition||'-') + '  |  Efektif: ' + (emp.meta.effectiveDate||'-');
    if(emp.formType==='resign') return 'Tanggal Resign: ' + (emp.meta.resignDate||'-') + '  |  Alasan: ' + (emp.meta.reason||'-');
    return '';
  }

  window.OCK = OCK;
  loadAll();
})();
</script>

</body>
